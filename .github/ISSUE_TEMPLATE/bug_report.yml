name: Bug report
description: Something in SekhVet does not work as described in the manual
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta. **Before you attach anything:** crop or anonymise screenshots and never attach DICOM files or images that show owner names, animal names or patient IDs. If a DICOM file is needed to reproduce the problem, say so below and we will arrange a private way to send it.
  - type: input
    id: build
    attributes:
      label: SekhVet build
      description: About SekhVet… shows "Version 1.0 beta (build N)". Vet Tools › Send Feedback… puts the same numbers into a template you can paste here.
      placeholder: "1.0 beta (build 95)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.1, Apple M3"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Database / import / export
        - 2D viewer / measurements
        - Hanging protocol / opening protocols
        - 3D MPR / double MPR
        - Spine labeling
        - Norberg angle / distraction index
        - Ultrasound calibration
        - DICOMweb (QIDO / WADO / STOW)
        - DICOM networking (C-STORE / C-FIND / C-MOVE)
        - Display / annotations / screen area
        - Installation / Gatekeeper / launch
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what did SekhVet do instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a CT study with …
        2. Vet Tools › …
        3. …
    validations:
      required: true
  - type: input
    id: modality
    attributes:
      label: Modality and device
      description: Helps a lot for calibration, hanging and import problems.
      placeholder: "CT, Siemens Somatom go.Now · US, Mindray Vetus 9 · DX, …"
  - type: textarea
    id: log
    attributes:
      label: System log (optional)
      description: "For MPR problems: `log show --predicate 'process == \"Horos\"' --last 30m | grep SekhVet`"
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Attachments contain no owner names, animal names or patient IDs.
          required: true
