name: Feature request
description: Something you miss in daily veterinary work
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: Describe the task in the practice, not the button you imagine. Which species, modality, workflow?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In SekhVet, in Horos/OsiriX, or with another tool.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal (optional)
  - type: markdown
    attributes:
      value: |
        SekhVet is a maintenance fork of Horos. Requests that need the viewer core rewritten (Metal, Swift, new rendering) are out of scope; veterinary tools and workflow fixes are in.
